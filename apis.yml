aid: knowde
name: Knowde
description: 'Knowde is an AI platform for industrial operations, built for the chemicals
  and ingredients industry. Knowde AI extracts, structures, harmonizes and enriches
  product data out of legacy systems and offline documents; Knowde MDM is the master
  data repository that data lands in; Knowde CXP launches supplier storefronts natively
  integrated with MDM; and the Knowde Marketplace is a network of 8,000+ chemical company
  storefronts. The Knowde API gives customers programmatic access to that platform through
  a GraphQL API (the recommended primary interface) and a RESTful JSON API, both served
  from developer-api.knowde.com behind OAuth 2.0 client credentials, with API Clients
  provisioned in the Developer Portal and a documented PIMS filter grammar for querying
  product, category and attribute data.'
