apis:
- name: Knowde GraphQL API
  description: 'The GraphQL API is Knowde''s recommended primary programmatic interface
    to the platform — anything possible in the REST API is intended to also be possible
    in GraphQL. The reference is generated from the Knowde GraphQL schema and exported
    as a standard GraphQL SDL file. The endpoint is served from developer-api.knowde.com
    and requires an OAuth 2.0 bearer token; introspection is authenticated-only.'
  humanURL: https://developer.knowde.com/documentation/graphql
  baseURL: https://developer-api.knowde.com/graphql
  tags:
  - GraphQL
  - Product Information Management
  - Master Data Management
  properties:
  - type: Documentation
    url: https://developer.knowde.com/documentation/graphql
  - type: Authentication
    url: https://developer.knowde.com/documentation/auth
- name: Knowde REST API
  description: 'The Knowde REST API is organized around RESTful resources with predictable
    resource-oriented URLs, JSON-encoded payloads and responses, and standard HTTP
    verbs and status codes. Resources include product, category, attribute and lead-group
    data in the Knowde PIMS, queried through the documented PIMS filter grammar. A
    staging environment is available so integrations can be built and tested without
    touching live data.'
  humanURL: https://developer.knowde.com/documentation/rest
  baseURL: https://developer-api.knowde.com
  tags:
  - REST
  - Product Information Management
  - Master Data Management
  properties:
  - type: Documentation
    url: https://developer.knowde.com/documentation/rest
  - type: Authentication
    url: https://developer.knowde.com/documentation/auth
