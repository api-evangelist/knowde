filtering:
  name: PIMS filters
  docs: https://developer.knowde.com/documentation/pims_filters
  description: A structured filter grammar for querying the Knowde Product Information
    Management System (PIMS). Filters are arrays of nested objects, so any number of
    filters can be combined in one request.
  json_shape: '[{"field": "weight", "fieldId": null, "type": {"range": {"numericRange":
    {"from": 1, "to": 10}}}}]'
  rest_encoding:
    method: GET
    style: Indexed query-parameter families, modeled on the JSON:API query parameter
      family convention, with required array indexes so the parameters parse
      unambiguously.
    example: /categories?filters[][field]=weight&filters[][type][range][numeric_range][to]=10&filters[][type][range][numeric_range][from]=1
  field_vs_field_id:
    field: The object property to filter on; must match the same value as in the
      response.
    field_id: Required when field is `attribute` or `category`; must be the slug of
      the property being filtered.
  types:
  - boolean
  - list
  - range
  - value
  list_modes:
    any: Matches results where the field contains any of the provided values (may also
      carry additional values).
    all: Requires the field to carry all of the provided values and nothing more.
rate_limiting:
  documented: true
  docs: https://developer.knowde.com/documentation/rate_limits
  window: 5 minutes
  limit_basis: Configured per Knowde subscription plan; Knowde publishes no fixed
    numeric limit.
  over_limit_status: 429
  headers:
  - name: RateLimit-Limit
    description: Total requests allowed within the current rate limit window, based
      on the subscription plan.
  - name: RateLimit-Remaining
    description: Requests remaining before the limit is reached; further requests are
      denied at zero.
  - name: RateLimit-Reset
    description: UNIX epoch time at which the quota resets.
  standard_alignment: Header names match the IETF RateLimit header fields draft
    (RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset).
  token_guidance: Clients that request too many OAuth tokens may themselves be rate
    limited.
